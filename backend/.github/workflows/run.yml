name: naksoo backend update

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Python 실행
        run: |
          cd backend
          python main.py

      - name: 결과 파일 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add backend/data/result.json
          git add backend/data/naksoo_*.json || true

          git commit -m "auto update result json" || echo "변경 없음"
          git push