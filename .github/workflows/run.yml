name: naksoo backend update

on:
  schedule:
    - cron: "17 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NAKSOO_BACKUP_RETENTION_DAYS: "3"
      NAKSOO_BACKUP_MAX_COUNT: "100"

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 오래된 백업 파일 삭제
        run: |
          cd backend
          python main.py --prune-backups

      - name: Python 실행
        run: |
          cd backend
          python main.py

      - name: 프론트엔드 데이터 복사
        run: |
          mkdir -p frontend/public/data
          cp backend/data/result.json frontend/public/data/result.json

      - name: 결과 파일 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A backend/data frontend/public/data backend/backups

          git commit -m "auto update result json" || echo "변경 없음"
          git push
